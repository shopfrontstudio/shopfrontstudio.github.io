      <stop offset="22%"  stop-color="#ee4a68"/>
      <stop offset="50%"  stop-color="#c91f40"/>
      <stop offset="78%"  stop-color="#8a0f26"/>
      <stop offset="100%" stop-color="#5a0817"/>
    </linearGradient>

    <!-- Soft inner glow to give the fruit some volume -->
